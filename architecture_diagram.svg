<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">8-Bit RISC Processor Architecture</title>
  <desc id="desc">Conceptual block diagram of the 8-bit RISC processor implemented in this repository, showing instruction memory, program counter, decoder, register file, and ALU.</desc>

  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #e2e8f0; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; }
      .wire { stroke: #7dd3fc; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .wire2 { stroke: #a7f3d0; stroke-width: 2.5; fill: none; marker-end: url(#arrow2); }
      .wire3 { stroke: #f9a8d4; stroke-width: 2.5; fill: none; marker-end: url(#arrow3); }
      .box { fill: #1e293b; stroke: #60a5fa; stroke-width: 2; rx: 18; }
      .box2 { fill: #1f2937; stroke: #34d399; stroke-width: 2; rx: 18; }
      .box3 { fill: #1f2937; stroke: #f472b6; stroke-width: 2; rx: 18; }
      .box4 { fill: #111827; stroke: #fbbf24; stroke-width: 2; rx: 18; }
      .pill { fill: rgba(96,165,250,0.12); stroke: #93c5fd; stroke-width: 1.5; }
      .note { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7f3d0"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9a8d4"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>

  <text class="title" x="600" y="58" text-anchor="middle">8-Bit RISC Processor Architecture</text>

  <!-- Instruction memory -->
  <rect class="box" x="70" y="120" width="220" height="170"/>
  <text class="label" x="180" y="155" text-anchor="middle">Instruction Memory</text>
  <text class="small" x="180" y="182" text-anchor="middle">256 x 16-bit entries</text>
  <text class="small" x="180" y="210" text-anchor="middle">memory[PC]</text>
  <text class="small" x="180" y="246" text-anchor="middle">Fetches next instruction</text>

  <!-- PC -->
  <rect class="box2" x="330" y="120" width="220" height="170"/>
  <text class="label" x="440" y="155" text-anchor="middle">Program Counter</text>
  <text class="small" x="440" y="182" text-anchor="middle">8-bit PC</text>
  <text class="small" x="440" y="210" text-anchor="middle">+1 on normal flow</text>
  <text class="small" x="440" y="238" text-anchor="middle">+ Bamt when Taken = 1</text>

  <!-- Decoder -->
  <rect class="box3" x="590" y="120" width="220" height="170"/>
  <text class="label" x="700" y="155" text-anchor="middle">Instruction Decoder</text>
  <text class="small" x="700" y="182" text-anchor="middle">Opcode[3:0]</text>
  <text class="small" x="700" y="210" text-anchor="middle">ALUOp, WB, ImmEnable</text>
  <text class="small" x="700" y="238" text-anchor="middle">ImmType, Branch</text>

  <!-- Register file -->
  <rect class="box" x="380" y="360" width="280" height="200"/>
  <text class="label" x="520" y="395" text-anchor="middle">Register File</text>
  <text class="small" x="520" y="422" text-anchor="middle">16 x 8-bit registers</text>
  <text class="small" x="520" y="450" text-anchor="middle">Read: A = registers[Ra], B = registers[Rb]</text>
  <text class="small" x="520" y="478" text-anchor="middle">Write: Rd ← Data when WB = 1</text>
  <text class="small" x="520" y="506" text-anchor="middle">R0 = 0, R1 = 1, LED0/LED1 mapped to R14/R15</text>

  <!-- ALU -->
  <rect class="box2" x="760" y="360" width="260" height="200"/>
  <text class="label" x="890" y="395" text-anchor="middle">ALU</text>
  <text class="small" x="890" y="422" text-anchor="middle">Operations:</text>
  <text class="small" x="890" y="450" text-anchor="middle">OR, ADD, SUB, AND, XOR, SLL, SRL</text>
  <text class="small" x="890" y="478" text-anchor="middle">Outputs: Result, Zero, Carry</text>

  <!-- Buses and arrows -->
  <path class="wire" d="M290 205 L330 205"/>
  <path class="wire2" d="M550 205 L590 205"/>
  <path class="wire2" d="M700 290 L700 330 L600 330 L600 360"/>
  <path class="wire3" d="M520 560 L520 610 L830 610 L830 560"/>
  <path class="wire" d="M660 360 L760 360"/>
  <path class="wire" d="M660 470 L760 470"/>

  <!-- Instruction bits to decoder -->
  <path class="wire" d="M290 260 L640 260 L640 120"/>

  <!-- Branch / control lines -->
  <path class="wire2" d="M810 120 L810 90 L450 90 L450 120"/>
  <text class="note" x="646" y="84">Branch control / Decode outputs</text>

  <!-- PC updates to memory -->
  <path class="wire" d="M440 290 L440 330 L180 330 L180 290"/>
  <text class="note" x="180" y="352">PC address to Instruction Memory</text>

  <!-- Output path -->
  <path class="wire3" d="M1020 460 L1100 460"/>
  <text class="note" x="1052" y="448">Result</text>

  <!-- Control labels around lines -->
  <g class="small">
    <text x="308" y="192">PC</text>
    <text x="566" y="192">Instr</text>
    <text x="708" y="342">WB / ImmEnable</text>
    <text x="690" y="468">ALUOp</text>
    <text x="450" y="590">A / B</text>
    <text x="895" y="622">Result, Zero, Carry</text>
  </g>

  <!-- Optional small status badges -->
  <rect class="pill" x="75" y="610" width="180" height="42"/>
  <text class="label" x="165" y="638" text-anchor="middle">Fetch</text>

  <rect class="pill" x="270" y="610" width="180" height="42"/>
  <text class="label" x="360" y="638" text-anchor="middle">Decode</text>

  <rect class="pill" x="465" y="610" width="180" height="42"/>
  <text class="label" x="555" y="638" text-anchor="middle">Execute</text>

  <rect class="pill" x="660" y="610" width="180" height="42"/>
  <text class="label" x="750" y="638" text-anchor="middle">Write-back</text>

  <rect class="pill" x="855" y="610" width="180" height="42"/>
  <text class="label" x="945" y="638" text-anchor="middle">Flags</text>
</svg>
